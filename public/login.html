<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Login — Samiyas Solomon</title>
  <meta name="description" content="Secure admin login for the portfolio dashboard.">
  <meta name="robots" content="noindex, nofollow">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="style.css">
</head>
<body class="auth-body">

  <!-- Ambient Glow Orbs -->
  <div class="ambient-orb ambient-orb--purple"></div>
  <div class="ambient-orb ambient-orb--cyan"></div>

  <main class="auth-wrap">
    <div class="auth-card glass">
      <div class="auth-card__head">
        <div class="auth-card__icon"><i class="fa-solid fa-lock"></i></div>
        <h1 class="auth-card__title">Admin Login</h1>
        <p class="auth-card__sub">Sign in to manage your portfolio content.</p>
      </div>

      <form id="login-form" novalidate>
        <div class="form__group">
          <label class="form__label" for="login-email">Email</label>
          <input
            type="email"
            id="login-email"
            name="email"
            class="form__input"
            placeholder="you@example.com"
            autocomplete="email"
            required
          >
        </div>

        <div class="form__group">
          <label class="form__label" for="login-password">Password</label>
          <input
            type="password"
            id="login-password"
            name="password"
            class="form__input"
            placeholder="••••••••"
            autocomplete="current-password"
            required
          >
        </div>

        <button type="submit" class="btn btn--primary" id="login-submit-btn" style="width: 100%; justify-content: center;">
          <i class="fa-solid fa-right-to-bracket"></i>
          <span id="login-submit-text">Sign In</span>
        </button>

        <div id="login-status" class="contact-status" role="status" aria-live="polite"></div>
      </form>

      <a href="index.html" class="auth-card__back">
        <i class="fa-solid fa-arrow-left"></i> Back to portfolio
      </a>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-client.js"></script>
  <script src="login.js"></script>
</body>
</html>
